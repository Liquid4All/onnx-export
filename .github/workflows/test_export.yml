name: Test Export

# Smoke test of the ONNX export pipeline on a GitHub-hosted runner (no GPU, no
# external services). Two jobs:
#
#   1. `export`         — run an export CLI for a model family, assert it
#                         produced an ONNX graph, then run one short inference
#                         ("hello") through onnxruntime-genai inline and record
#                         whether it passed.
#   2. `run-inference`  — a lightweight gate that re-publishes that inline
#                         inference result as its own pass/fail check.
#
# Inference runs inside `export` (same runner, no artifact handoff) but is
# surfaced as a separate `run-inference` check: `export` stays green even when
# inference fails, and a red `run-inference` points squarely at inference, not
# export.
#
# Triggers:
#   * push to main / PRs against main that touch export code (default model)
#   * manual dispatch (pick the model, family, and precision)
#
# Released onnxruntime-genai runs the text models only; for the moe, vl and audio
# families the job builds onnxruntime-genai at the commit the model builder is
# pinned to (liquidonnx.genai_builder.GENAI_COMMIT), cached per commit and onnxruntime version.
#
# Large checkpoints may exceed the runner's disk/RAM — keep to a small model
# (the defaults export in a few minutes). CPU inference on a hosted runner is
# slow for large checkpoints, so the inline inference is time-bounded by
# `INFER_TIMEOUT`. To export a gated/private model, add an `HF_TOKEN`
# repository secret.

on:
  workflow_dispatch:
    inputs:
      model:
        description: HF model slug to export (e.g. LiquidAI/LFM2-350M)
        required: true
        default: LiquidAI/LFM2-350M
      family:
        description: Model family (selects the export CLI)
        type: choice
        options:
          - text
          - vl
          - moe
          - audio
        default: text
      precision:
        description: 'Precision(s) to export, space-separated (e.g. "q4" or "fp16 q4")'
        required: true
        default: q4
  push:
    branches: [main]
    paths: &export-paths
      - 'src/liquidonnx/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test_export.yml'
  pull_request:
    paths: *export-paths

# Manual dispatches each get a unique group (the run id), so parameter sweeps —
# e.g. one run per model/precision — execute in parallel instead of cancelling
# each other. Push/PR runs keep one group per ref with cancel-in-progress, so a
# superseded commit's run is still cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  export:
    runs-on: ubuntu-latest
    # Expose the inline smoke-test result so the `run-inference` gate can turn
    # it into its own pass/fail check without re-running anything.
    outputs:
      inference_passed: ${{ steps.infer.outputs.inference_passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ONNX exports (fp32 base + quantized copies) are large; reclaim the disk
      # the GitHub image spends on toolchains this job doesn't use.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv python install 3.12
      - run: uv sync

      - name: Resolve the onnxruntime-genai commit and onnxruntime version
        id: genai
        if: (inputs.family || 'text') != 'text'
        run: |
          commit=$(uv run python -c 'from liquidonnx.genai_builder import GENAI_COMMIT; print(GENAI_COMMIT)')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          ort=$(uv run python -c 'import onnxruntime; print(onnxruntime.__version__)')
          echo "ort=$ort" >> "$GITHUB_OUTPUT"

      - name: Restore the onnxruntime-genai build
        id: genai-cache
        if: steps.genai.outputs.commit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: genai-python
          key: onnxruntime-genai-${{ runner.os }}-${{ steps.genai.outputs.commit }}-ort${{ steps.genai.outputs.ort }}

      # The build leaves an importable Python package in build/Linux/Release/wheel (packaging
      # the wheel itself needs pip). It runs on the onnxruntime from uv.lock, so it is built
      # against that release's headers.
      - name: Build onnxruntime-genai
        if: steps.genai.outputs.commit && steps.genai-cache.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ steps.genai.outputs.commit }}
          ORT: ${{ steps.genai.outputs.ort }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/microsoft/onnxruntime/releases/download/v$ORT/onnxruntime-linux-x64-$ORT.tgz" | tar xz
          git init -q genai-src
          git -C genai-src fetch -q --depth 1 https://github.com/microsoft/onnxruntime-genai.git "$COMMIT"
          git -C genai-src checkout -q FETCH_HEAD
          uv pip install pip
          cd genai-src
          "$GITHUB_WORKSPACE/.venv/bin/python" build.py --config Release --parallel \
            --skip_tests --skip_examples --cmake_extra_defines ENABLE_TESTS=OFF \
            --ort_home "$GITHUB_WORKSPACE/onnxruntime-linux-x64-$ORT"
          mv build/Linux/Release/wheel "$GITHUB_WORKSPACE/genai-python"

      - name: Use the onnxruntime-genai build
        if: steps.genai.outputs.commit
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/genai-python" >> "$GITHUB_ENV"
          PYTHONPATH="$GITHUB_WORKSPACE/genai-python" uv run python -c \
            'import onnxruntime_genai as og; print("onnxruntime-genai", og.__version__, og.__file__)'

      - name: Export to ONNX
        env:
          # On push/PR the `inputs` context is empty, so fall back to the same
          # defaults the workflow_dispatch form offers.
          MODEL: ${{ inputs.model || 'LiquidAI/LFM2-350M' }}
          FAMILY: ${{ inputs.family || 'text' }}
          PRECISION: ${{ inputs.precision || 'q4' }}
          # Optional: set an HF_TOKEN repo secret to export gated/private models.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          case "$FAMILY" in
            text)  CLI=lfm2-export ;;
            vl)    CLI=lfm2-vl-export ;;
            moe)   CLI=lfm2-moe-export ;;
            audio) CLI=lfm2-audio-export ;;
            *) echo "::error::unknown family '$FAMILY'"; exit 1 ;;
          esac
          echo "Exporting $MODEL with '$CLI --precision $PRECISION'"
          # $PRECISION is intentionally unquoted so multiple precisions split into args.
          uv run "$CLI" "$MODEL" --precision $PRECISION

      - name: Show exported files
        run: |
          ls -lashR exports
          echo "ONNX graphs:"
          find exports -name '*.onnx' -printf '%s\t%p\n' || true

      - name: Assert an ONNX graph was produced
        run: |
          count=$(find exports -name '*.onnx' | wc -l)
          echo "Produced $count ONNX graph(s)"
          test "$count" -gt 0

      # Run one short generation right here on the freshly-exported files — no
      # artifact handoff. The step never fails the job (continue-on-error +
      # always records a result); the `run-inference` gate turns the recorded
      # result into a pass/fail check of its own.
      - name: Run inference (send "hello")
        id: infer
        continue-on-error: true
        env:
          # On push/PR the `inputs` context is empty; mirror the export defaults.
          FAMILY: ${{ inputs.family || 'text' }}
          PROMPT: hello
          # Keep the smoke test cheap on CPU — we only need a few tokens to prove
          # the graph loads and runs.
          MAX_TOKENS: '16'
          # Seconds before the single generation is force-killed. CPU inference
          # on a hosted runner is slow for large checkpoints, so cap it and let a
          # timeout (rather than a multi-hour hang) be the failure signal.
          INFER_TIMEOUT: '600'
        run: |
          # No `set -e`: a failed generation must still record a result and let
          # the `run-inference` gate (not this step) be the red check.
          set -uo pipefail

          fail() {  # record failure, note it, and stop the step (job stays green)
            echo "inference_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$1 (reported by the run-inference gate)"
            exit 1
          }

          # Exactly one "<model>-ONNX" directory is produced per export.
          MODEL_DIR=$(find exports -maxdepth 1 -type d -name '*-ONNX' | head -n1)
          [ -n "$MODEL_DIR" ] || fail "no exported model directory found under exports/"
          ONNX_DIR="$MODEL_DIR/onnx"
          echo "Model dir: $MODEL_DIR"
          ls -la "$ONNX_DIR"

          run() {  # bound a single generation; map success/timeout/error to the output
            echo "+ timeout ${INFER_TIMEOUT}s: $*"
            if timeout "$INFER_TIMEOUT" "$@" </dev/null; then
              echo "inference_passed=true" >> "$GITHUB_OUTPUT"
              echo "Inference smoke test passed."
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then
                fail "inference smoke test timed out after ${INFER_TIMEOUT}s"
              else
                fail "inference smoke test failed (exit $rc)"
              fi
            fi
          }

          # Each CLI loads the precision genai_config.json points at (quantized first).
          case "$FAMILY" in
            text|moe)
              CLI=lfm2-infer; [ "$FAMILY" = moe ] && CLI=lfm2-moe-infer
              run uv run "$CLI" --model "$MODEL_DIR" --prompt "$PROMPT" \
                --no-stream --max-tokens "$MAX_TOKENS"
              ;;
            vl)
              run uv run lfm2-vl-infer --model "$MODEL_DIR" \
                --images tests/test_lfm2_vl/assets/cardinal.jpg --prompt "$PROMPT" \
                --no-stream --max-tokens "$MAX_TOKENS"
              ;;
            audio)
              run uv run lfm2-audio-infer "$MODEL_DIR" --mode asr \
                --audio samples/audio/woodworks_question.wav --no-stream --max-tokens "$MAX_TOKENS"
              run uv run lfm2-audio-infer "$MODEL_DIR" --mode tts --prompt "$PROMPT" \
                --output "$RUNNER_TEMP/tts.wav" --no-stream --max-tokens "$MAX_TOKENS"
              ;;
            *) fail "unknown family '$FAMILY'" ;;
          esac

  run-inference:
    # Gate job: re-publishes the inline smoke-test result (run inside `export`)
    # as its own pass/fail check. Needs no checkout, deps, or artifacts — it
    # only reads the job output. Skipped if `export` itself fails.
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the inference result
        env:
          PASSED: ${{ needs.export.outputs.inference_passed }}
        run: |
          echo "inference_passed='$PASSED'"
          if [ "$PASSED" = "true" ]; then
            echo "Inference smoke test passed."
          else
            echo "::error::inference smoke test failed — see the 'Run inference (send \"hello\")' step in the export job"
            exit 1
          fi
