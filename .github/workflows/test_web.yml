name: Test WebGPU

# Runs the synthetic LFM2.5-Audio graphs on onnxruntime-web's WebGPU EP in headless
# Chromium (SwiftShader) and checks outputs against the wasm EP. See tests/web/README.md.

on:
  push:
    branches: [main]
    paths: &web-paths
      - 'src/liquidonnx/**'
      - 'tests/web/**'
      - 'tests/test_lfm2_audio/synthetic.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test_web.yml'
  pull_request:
    paths: *web-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run python tests/web/export_synthetic.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: npm ci
        working-directory: tests/web
      - run: npx playwright install --with-deps chromium
        working-directory: tests/web
      - run: npm test
        working-directory: tests/web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: tests/web/test-results/
          retention-days: 7
