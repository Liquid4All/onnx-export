[project]
name = "liquidonnx"
version = "0.1.0"
description = "LFM2 ONNX export and inference tools"
requires-python = ">=3.12"

dependencies = [
    "onnx>=1.22.0",
    "onnxruntime>=1.30.0",  # Audio graphs verified against 1.30; the old nightly index had no macOS wheels
    "onnxruntime-genai>=0.16.0",  # Placeholder; build main at GENAI_COMMIT (README)
    "transformers>=5.17.0",
    "numpy>=2.2.0,<2.6",  # numba (via librosa) requires numpy < 2.6
    "torch>=2.0.0",
    "pillow",
    "torchvision>=0.24.1",
    "onnx-ir>=1.0.0",
    "scipy>=1.12.0",  # WAV output of lfm2-audio-infer
    "onnxscript>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "liquid-audio>=1.3.0",  # Reference model for audio export/tests (1.3 supports transformers 5.x)
]

[project.scripts]
# LFM2 text model tools
lfm2-export = "liquidonnx.lfm2.export:main"
lfm2-infer = "liquidonnx.lfm2.infer:main"
lfm2-bench = "liquidonnx.lfm2.benchmark:main"

# LFM2-VL vision-language model tools
lfm2-vl-export = "liquidonnx.lfm2_vl.export:main"
lfm2-vl-infer = "liquidonnx.lfm2_vl.infer:main"

# LFM2-MoE (Mixture of Experts) model tools
lfm2-moe-export = "liquidonnx.lfm2_moe.export:main"
lfm2-moe-infer = "liquidonnx.lfm2.infer:main"

# LFM2.5-Audio multimodal audio model tools
lfm2-audio-export = "liquidonnx.lfm2_audio.export:main"
lfm2-audio-infer = "liquidonnx.lfm2_audio.infer:main"

# Exports against their reference models
lfm2-compare = "liquidonnx.compare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liquidonnx"]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "liquid-audio>=1.3.0",
]
