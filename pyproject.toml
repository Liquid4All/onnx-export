[project]
name = "liquidonnx"
version = "0.1.0"
description = "LFM2 ONNX export and inference tools"
requires-python = ">=3.12"

dependencies = [
    "onnx",
    "onnxruntime>=1.24.0.dev",  # Nightly for QMoE 14-input support
    "transformers>=5.0.0.dev0",
    "numpy>=2.2.0,<2.4",  # numba requires numpy < 2.4
    "torch>=2.0.0",
    "pillow",
    "torchvision>=0.24.1",
    "onnx-ir>=0.1.13",
    "scipy>=1.12.0",  # For ISTFT in audio decoding
    "onnxscript>=0.5.7",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.24.0.dev",  # CUDA support (replaces onnxruntime)
]
dev = [
    "pytest",
    "ruff",
    "liquid-audio>=1.1.0",  # Reference model for audio export/tests
]

[project.scripts]
# LFM2 text model tools
lfm2-export = "liquidonnx.lfm2.export:main"
lfm2-infer = "liquidonnx.lfm2.infer:main"
lfm2-bench = "liquidonnx.lfm2.benchmark:main"

# LFM2-VL vision-language model tools
lfm2-vl-export = "liquidonnx.lfm2_vl.export:main"
lfm2-vl-infer = "liquidonnx.lfm2_vl.infer:main"

# LFM2-MoE (Mixture of Experts) model tools
lfm2-moe-export = "liquidonnx.lfm2_moe.export:main"
lfm2-moe-infer = "liquidonnx.lfm2_moe.infer:main"

# LFM2.5-Audio model tools
lfm2-audio-export = "liquidonnx.lfm2_audio.export:main"
lfm2-audio-infer = "liquidonnx.lfm2_audio.infer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liquidonnx"]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
# For bleeding-edge packages from git
prerelease = "if-necessary-or-explicit"

[[tool.uv.index]]
name = "ort-nightly"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ORT-Nightly/pypi/simple/"
explicit = true

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "3c25177" }
onnxruntime = { index = "ort-nightly" }
onnxruntime-gpu = { index = "ort-nightly" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "liquid-audio>=1.1.0",
]
