[project]
name = "liquidonnx"
version = "0.1.0"
description = "LFM2 ONNX export and inference tools"
requires-python = ">=3.10"

dependencies = [
    "onnx",           # @latest from git (see [tool.uv.sources])
    "onnxruntime",
    "transformers>=5.0.0.dev0",
    "numpy>=2.2.0",
    "torch>=2.0.0",
    "pillow",
    "torchvision>=0.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
# LFM2 text model tools
lfm2-export = "liquidonnx.lfm2.export:main"
lfm2-infer = "liquidonnx.lfm2.generate:main"
lfm2-bench = "liquidonnx.lfm2.benchmark:main"

# LFM2-VL vision-language model tools
lfm2-vl-export = "liquidonnx.lfm2_vl.export:main"
lfm2-vl-infer = "liquidonnx.lfm2_vl.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liquidonnx"]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
# For bleeding-edge packages from git
[tool.uv.sources]
onnx = { git = "https://github.com/onnx/onnx.git" }
