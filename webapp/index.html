<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LFM2 Chat - WebGPU</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16213e;
      padding: 1rem;
      border-bottom: 1px solid #0f3460;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: #16213e;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .controls select, .controls button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #eee;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .controls button {
      background: #e94560;
      border-color: #e94560;
      font-weight: 600;
    }

    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .controls button:hover:not(:disabled) {
      background: #ff6b6b;
    }

    #status {
      padding: 0.5rem 1rem;
      background: #0f3460;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    #status.error {
      background: #7f1d1d;
      color: #fca5a5;
    }

    #status.success {
      background: #14532d;
      color: #86efac;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #0f3460;
    }

    .message.assistant {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
    }

    .message.generating {
      opacity: 0.8;
    }

    .input-area {
      padding: 1rem;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 0.5rem;
    }

    #userInput {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #eee;
      font-size: 1rem;
      resize: none;
    }

    #userInput:focus {
      outline: none;
      border-color: #e94560;
    }

    #sendBtn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stats {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    .progress-bar {
      position: relative;
      height: 24px;
      background: #0f3460;
      margin: 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.75rem;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <header>
    <h1>LFM2 Chat</h1>
  </header>

  <div class="controls">
    <label>
      Model:
      <select id="modelSelect">
        <option value="LFM2-350M-Q4">LFM2-350M Q4 (459 MB)</option>
        <option value="LFM2-700M-Q4">LFM2-700M Q4 (803 MB)</option>
        <option value="LFM2-1.2B-Q4" selected>LFM2-1.2B Q4 (1.1 GB)</option>
        <option value="LFM2-2.6B-Q4">LFM2-2.6B Q4 (2.0 GB)</option>
      </select>
    </label>
    <button id="loadBtn">Load Model</button>
    <button id="clearBtn">Clear Chat</button>
  </div>

  <div id="progressBar" class="progress-bar" style="display: none;">
    <div id="progressFill" class="progress-fill"></div>
    <span id="progressText" class="progress-text">0%</span>
  </div>

  <div id="status">Select a model and click "Load Model" to start</div>

  <div class="chat-container" id="chatContainer"></div>

  <div class="input-area">
    <textarea id="userInput" rows="2" placeholder="Type your message..." disabled></textarea>
    <button id="sendBtn" disabled>Send</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
