<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LFM2 Chat - WebGPU</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16213e;
      padding: 1rem;
      border-bottom: 1px solid #0f3460;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: #16213e;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .controls select, .controls button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #eee;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .controls button {
      background: #e94560;
      border-color: #e94560;
      font-weight: 600;
    }

    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .controls button:hover:not(:disabled) {
      background: #ff6b6b;
    }

    #status {
      padding: 0.5rem 1rem;
      background: #0f3460;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    #status.error {
      background: #7f1d1d;
      color: #fca5a5;
    }

    #status.success {
      background: #14532d;
      color: #86efac;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #0f3460;
    }

    .message.assistant {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
    }

    .message.generating {
      opacity: 0.8;
    }

    .message img {
      max-width: 300px;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      display: block;
    }

    .input-area {
      padding: 1rem;
      background: #16213e;
      border-top: 1px solid #0f3460;
    }

    .image-preview {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .image-preview-item {
      position: relative;
      display: inline-block;
    }

    .image-preview-item img {
      max-width: 100px;
      max-height: 80px;
      border-radius: 6px;
      border: 2px solid #0f3460;
    }

    .image-preview-item .remove-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e94560;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    #userInput {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #eee;
      font-size: 1rem;
      resize: none;
    }

    #userInput:focus {
      outline: none;
      border-color: #e94560;
    }

    .input-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    #imageBtn {
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #eee;
      cursor: pointer;
      font-size: 1.2rem;
    }

    #imageBtn:hover:not(:disabled) {
      background: #0f3460;
    }

    #imageBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #sendBtn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stats {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    .progress-bar {
      position: relative;
      height: 24px;
      background: #0f3460;
      margin: 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.75rem;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .model-type-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      margin-left: 0.5rem;
      font-weight: 600;
    }

    .model-type-badge.vl {
      background: #7c3aed;
      color: white;
    }

    .model-type-badge.text {
      background: #0f3460;
      color: #94a3b8;
    }

    #imageInput {
      display: none;
    }

    .drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(233, 69, 96, 0.2);
      border: 4px dashed #e94560;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #e94560;
    }

    .drop-overlay.active {
      display: flex;
    }
  </style>
</head>
<body>
  <header>
    <h1>LFM2 Chat</h1>
  </header>

  <div class="controls">
    <label>
      Model:
      <select id="modelSelect">
        <optgroup label="Text Models">
          <option value="LFM2-350M-Q4">LFM2-350M Q4 (459 MB)</option>
          <option value="LFM2-700M-Q4">LFM2-700M Q4 (803 MB)</option>
          <option value="LFM2-1.2B-Q4" selected>LFM2-1.2B Q4 (1.1 GB)</option>
          <option value="LFM2-2.6B-Q4">LFM2-2.6B Q4 (2.0 GB)</option>
        </optgroup>
        <optgroup label="Vision-Language Models">
          <option value="LFM2-VL-450M-B4V4">LFM2-VL-450M B4V4 (470 MB)</option>
          <option value="LFM2-VL-1.6B-B4V4">LFM2-VL-1.6B B4V4 (1.2 GB)</option>
          <option value="LFM2-VL-3B-B4V4">LFM2-VL-3B B4V4 (2.2 GB)</option>
        </optgroup>
      </select>
    </label>
    <button id="loadBtn">Load Model</button>
    <button id="clearBtn">Clear Chat</button>
    <span id="modelTypeBadge"></span>
  </div>

  <div id="progressBar" class="progress-bar" style="display: none;">
    <div id="progressFill" class="progress-fill"></div>
    <span id="progressText" class="progress-text">0%</span>
  </div>

  <div id="status">Select a model and click "Load Model" to start</div>

  <div class="chat-container" id="chatContainer"></div>

  <div class="input-area">
    <div class="image-preview" id="imagePreview"></div>
    <div class="input-row">
      <textarea id="userInput" rows="2" placeholder="Type your message..." disabled></textarea>
      <div class="input-buttons">
        <button id="imageBtn" title="Add image (or paste/drop)" disabled>📷</button>
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>
    <input type="file" id="imageInput" accept="image/*" multiple>
  </div>

  <div class="drop-overlay" id="dropOverlay">Drop images here</div>

  <script type="module" src="./main.js"></script>
</body>
</html>
